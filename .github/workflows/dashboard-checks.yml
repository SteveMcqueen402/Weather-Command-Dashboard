name: Dashboard checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server JavaScript
        run: node --check server.mjs
      - name: Check client JavaScript
        run: node --check app.js
      - name: Verify essential web files
        run: |
          test -f index.html
          test -f app.js
          test -f style.css
          test -f aircraft-identifiers.cjs
      - name: Run unit tests
        run: npm test
      - name: Smoke-test running server
        run: |
          node server.mjs > /tmp/weather-dashboard.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent http://127.0.0.1:3000/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/weather-dashboard.log
          exit 1
      - name: Probe live Render dashboard
        env:
          LIVE_URL: https://weather-command-dashboard.onrender.com
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Checking deployed dashboard, attempt $attempt"
            http_code=$(curl -L -sS -o /tmp/live-health.json -w '%{http_code}' --connect-timeout 8 --max-time 40 "$LIVE_URL/healthz" || true)
            echo "Health HTTP: $http_code"
            if [ -f /tmp/live-health.json ]; then head -c 500 /tmp/live-health.json; echo; fi
            if [ "$http_code" = "200" ] && grep -q '"status":"ok"' /tmp/live-health.json; then
              curl --fail --location --show-error --silent --max-time 40 "$LIVE_URL/" -o /tmp/live-index.html || exit 1
              curl --fail --location --show-error --silent --max-time 40 "$LIVE_URL/app.js" -o /tmp/live-app.js || exit 1
              curl --fail --location --show-error --silent --max-time 40 "$LIVE_URL/aircraft-identifiers.cjs" -o /tmp/live-identifiers.cjs || exit 1
              node --check /tmp/live-app.js || exit 1
              grep -q '<title>Weather Command' /tmp/live-index.html || exit 1
              grep -q 'window.AircraftIdentifiers' /tmp/live-identifiers.cjs || exit 1
              if cmp -s /tmp/live-app.js app.js; then
                echo "Live app.js matches the repository"
              else
                echo "::warning::Live app.js differs from GitHub main (Render may be serving an older deployment)"
                sha256sum /tmp/live-app.js app.js
              fi
              if cmp -s /tmp/live-index.html index.html; then
                echo "Live index.html matches the repository"
              else
                echo "::warning::Live index.html differs from GitHub main"
                sha256sum /tmp/live-index.html index.html
              fi
              echo "Live Render dashboard and browser code healthy"
              exit 0
            fi
            sleep 15
          done
          echo "Render deployment did not pass health and asset checks"
          exit 1
      - name: Inspect production weather data feeds
        if: always()
        env:
          LIVE_URL: https://weather-command-dashboard.onrender.com
        run: |
          while IFS='|' read -r label endpoint; do
            if [ -z "$label" ]; then continue; fi
            echo "::group::$label"
            status=$(curl -L -sS -o /tmp/feed-response -w '%{http_code}' --connect-timeout 8 --max-time 40 "$LIVE_URL$endpoint" || true)
            echo "$label HTTP $status"
            if [ -f /tmp/feed-response ]; then
              head -c 700 /tmp/feed-response
              echo
            fi
            if [ "$status" != "200" ]; then echo "::warning::$label did not return HTTP 200 (status $status)"; fi
            echo "::endgroup::"
          done <<'FEEDS'
          METAR_TAF_AIRPORT|/api/airport-route?ids=KOMA
          NWS_FORECAST|/api/location-forecast?lat=41.301&lon=-95.894
          NWS_ALERTS|/api/home-alerts?lat=41.301&lon=-95.894
          AVIATION_HAZARDS|/api/aviation-hazards?station=KOMA&lat=41.301&lon=-95.894
          RADAR|/api/radar
          PROVIDER_STATUS|/api/provider-status
          FEEDS

      - name: Browser smoke test of live dashboard
        env:
          LIVE_URL: https://weather-command-dashboard.onrender.com
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium
          node --input-type=module <<'BROWSER_TEST'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const pageErrors=[];
          page.on('pageerror',error=>pageErrors.push(error.message));
          try{
            const response=await page.goto(process.env.LIVE_URL+'/',{waitUntil:'domcontentloaded',timeout:45000});
            if(!response?.ok())throw Error('Dashboard HTML HTTP '+response?.status());
            await page.waitForFunction(()=>/^\\d{2}:\\d{2}:\\d{2}Z$/.test(document.querySelector('#utc')?.textContent||''),{timeout:20000});
            await page.waitForFunction(()=>/^(METAR|SPECI) KOMA\\b/i.test(document.querySelector('#aviation-raw')?.textContent||''),{timeout:35000});
            await page.waitForFunction(()=>/\\d+°[FC]/.test(document.querySelector('#temp')?.textContent||''),{timeout:35000});
            const snapshot=await page.evaluate(()=>({
              utc:document.querySelector('#utc')?.textContent,
              metar:document.querySelector('#aviation-raw')?.textContent?.slice(0,150),
              temperature:document.querySelector('#temp')?.textContent,
              radar:document.querySelector('#map-caption')?.textContent,
              errors:document.querySelector('#notice')?.textContent
            }));
            console.log('Browser dashboard snapshot:',JSON.stringify(snapshot));
            if(pageErrors.length)throw Error('Uncaught browser errors: '+pageErrors.join('; '));
            console.log('Browser smoke test passed');
          }finally{await browser.close()}
          BROWSER_TEST
